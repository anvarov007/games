<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1050px;
    }

    /* Sarlavha */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    /* Forma qismi */
    .form-box {
      background-color: #151e34;
      padding: 18px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      border: 1px solid #23304d;
      flex-wrap: wrap;
    }

    .form-box input {
      background-color: #0d1526;
      border: 1px solid #2b3a5a;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .form-box input::placeholder {
      color: #7a8aa8;
    }

    .form-box input:focus {
      border-color: #38bdf8;
    }

    #gameName {
      flex: 2;
      min-width: 180px;
    }

    #gameImage {
      flex: 3;
      min-width: 220px;
    }

    #gameYear {
      flex: 1;
      min-width: 100px;
    }

    .btn-submit {
      background-color: #38bdf8;
      color: #0b132b;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #0ea5e9;
    }

    /* Kartochkalar tarmog'i */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: #151e34;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #23304d;
      position: relative;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Yil nishoni (Badge) */
    .year-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .card-body {
      padding: 18px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* Tugmalar qatori */
    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      border: 1px solid #2b3a5a;
      background-color: #1c2742;
      color: #ffffff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }

    .btn-like:hover {
      background-color: #263457;
    }

    .btn-edit {
      color: #93c5fd;
    }

    .btn-edit:hover {
      background-color: #1e3a8a;
    }

    .btn-delete {
      color: #fca5a5;
    }

    .btn-delete:hover {
      background-color: #7f1d1d;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Sarlavha -->
    <div class="header">
      <span style="font-size: 28px;">🎮</span>
      <h1>Games</h1>
    </div>

    <!-- Qo'shish va Tahrirlash Formasi -->
    <form class="form-box" id="gameForm">
      <input type="text" id="gameName" placeholder="O'yin nomi" required>
      <input type="url" id="gameImage" placeholder="Rasm URL (bo'sh qolsa avtomatik)">
      <input type="number" id="gameYear" placeholder="Yil" min="1970" max="2030" required>
      <button type="submit" class="btn-submit" id="submitBtn">Qo'shish</button>
    </form>

    <!-- O'yinlar ro'yxati -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <script>
    // Boshlang'ich ma'lumotlar (rasmdagidek)
    const defaultGames = [
      {
        id: 1,
        name: "Roblox",
        year: 2006,
        likes: 67,
        image: "https://unsplash.com"
      },
      {
        id: 2,
        name: "Minecraft",
        year: 2011,
        likes: 120,
        image: "https://unsplash.com"
      },
      {
        id: 3,
        name: "Fortnite",
        year: 2017,
        likes: 85,
        image: "https://unsplash.com"
      }
    ];

    // LocalStorage dan ma'lumotlarni olish
    let games = JSON.parse(localStorage.getItem('gamesData')) || defaultGames;
    let editId = null;

    const gameForm = document.getElementById('gameForm');
    const gameNameInput = document.getElementById('gameName');
    const gameImageInput = document.getElementById('gameImage');
    const gameYearInput = document.getElementById('gameYear');
    const submitBtn = document.getElementById('submitBtn');
    const gamesGrid = document.getElementById('gamesGrid');

    // Ma'lumotlarni saqlash va ekranga chizish
    function saveAndRender() {
      localStorage.setItem('gamesData', JSON.stringify(games));
      renderGames();
    }

    // Kartochkalarni HTML ga chizish
    function renderGames() {
      gamesGrid.innerHTML = '';

      games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${game.image}" alt="${game.name}" onerror="this.src='https://picsum.photos{game.id}'">
            <span class="year-badge">${game.year}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${game.name}</div>
            <div class="card-actions">
              <button class="action-btn btn-like" onclick="likeGame(${game.id})">
                ❤️ <span>${game.likes}</span>
              </button>
              <button class="action-btn btn-edit" onclick="editGame(${game.id})">
                Tahrirlash
              </button>
              <button class="action-btn btn-delete" onclick="deleteGame(${game.id})">
                O'chirish
              </button>
            </div>
          </div>
        `;

        gamesGrid.appendChild(card);
      });
    }

    // Yangi o'yin qo'shish yoki tahrirlanganini saqlash
    gameForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = gameNameInput.value.trim();
      const year = parseInt(gameYearInput.value);
      let image = gameImageInput.value.trim();

      // Agar rasm URL bo'sh qolsa avtomatik rasm qo'yish
      if (!image) {
        image = `https://picsum.photos{Date.now()}`;
      }

      if (editId) {
        // Tahrirlash rejimi
        games = games.map(game =>
          game.id === editId ? { ...game, name, year, image } : game
        );
        editId = null;
        submitBtn.textContent = "Qo'shish";
      } else {
        // Yangi qo'shish rejimi
        const newGame = {
          id: Date.now(),
          name,
          year,
          image,
          likes: 0
        };
        games.push(newGame);
      }

      gameForm.reset();
      saveAndRender();
    });

    // Layk bosish funksiyasi
    window.likeGame = function (id) {
      games = games.map(game =>
        game.id === id ? { ...game, likes: game.likes + 1 } : game
      );
      saveAndRender();
    };

    // Tahrirlash funksiyasi
    window.editGame = function (id) {
      const gameToEdit = games.find(game => game.id === id);
      if (gameToEdit) {
        gameNameInput.value = gameToEdit.name;
        gameImageInput.value = gameToEdit.image;
        gameYearInput.value = gameToEdit.year;
        editId = id;
        submitBtn.textContent = "Saqlash";
        gameNameInput.focus();
      }
    };

    // O'chirish funksiyasi
    window.deleteGame = function (id) {
      games = games.filter(game => game.id !== id);
      if (editId === id) {
        editId = null;
        gameForm.reset();
        submitBtn.textContent = "Qo'shish";
      }
      saveAndRender();
    };

    // Dastlabki ishga tushirish
    renderGames();
  </script>
</body>

</html>
